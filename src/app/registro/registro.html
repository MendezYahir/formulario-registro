<div class="form-container">
  <h2>Registro de Usuario</h2>

  <form #registroForm="ngForm" (ngSubmit)="registrar()">
    <div class="form-group">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="usuario.nombre" required>
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" [(ngModel)]="usuario.email" required>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" [(ngModel)]="usuario.telefono" required>
    </div>

    <div class="form-group">
      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" [(ngModel)]="usuario.edad" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" [(ngModel)]="usuario.password" required>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar contraseña:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="usuario.confirmPassword" required>
    </div>

    <button type="submit">Registrar</button>
  </form>

  <div *ngIf="datosRegistrados" class="resultado">
    <h3>Información Capturada</h3>
    <p><strong>Nombre:</strong> {{ datosRegistrados.nombre }}</p>
    <p><strong>Correo electrónico:</strong> {{ datosRegistrados.email }}</p>
    <p><strong>Teléfono:</strong> {{ datosRegistrados.telefono }}</p>
    <p><strong>Edad:</strong> {{ datosRegistrados.edad }}</p>
    <p><strong>Contraseña:</strong> {{ datosRegistrados.password }}</p>
  </div>
</div>
